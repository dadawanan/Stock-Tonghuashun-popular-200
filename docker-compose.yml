version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    restart: always
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "55443:5432"
    volumes:
      - stock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  stock-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stock-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: stock_db
      DB_USER: postgresql
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src

  stock-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stock-scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "stock_service.scheduler"]
    environment:
      DB_HOST: postgres
      DB_NAME: stock_db
      DB_USER: postgresql
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src

  stock-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stock-web
    restart: always
    ports:
      - "8001:8001"

volumes:
  stock_pgdata:
    name: stock_pgdata