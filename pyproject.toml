[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock"
version = "0.1.0"
description = "A股人气榜股票数据采集、行情分析、新闻情绪分析平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.59",
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "curl-cffi>=0.13.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "mootdx>=0.11.7",
    "pandas>=2.2.3",
    "pywencai>=0.13.1",
    "requests>=2.32.3",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "vectorbt>=1.0.0",
    "plotly>=5.0",
    "numba>=0.58",
]

[project.scripts]
stock-main = "stock_service.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.25.0,<0.26.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
